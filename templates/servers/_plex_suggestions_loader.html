<div id="plex-suggestions" class="rounded-xl border border-slate-800 p-4"
     hx-get="{{ url_for('server_plex_suggestions_partial') }}"
     hx-trigger="load" hx-swap="outerHTML" hx-sync="this:drop"
     hx-request='{"timeout":20000}' aria-live="polite">
  <h3 class="text-sm font-semibold">Plex</h3>
  <p class="mt-2 text-xs text-slate-400 htmx-indicator">{{ t('loading') }}</p>
  <button type="button" class="mt-3 rounded-lg border border-slate-700 px-3 py-2 text-sm"
          hx-get="{{ url_for('server_plex_suggestions_partial') }}"
          hx-target="#plex-suggestions" hx-swap="outerHTML" hx-sync="#plex-suggestions:drop">{{ t('retry') }}</button>
</div>
