{% extends "base.html" %}

{% block header_title %}{{ t("plex_auth_error_title") }}{% endblock %}
{% block header_subtitle %}{{ t("plex_auth_error_help") }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg rounded-xl border border-rose-900/70 bg-slate-900 p-5 sm:p-7">
  <div class="text-sm text-rose-200">{{ t(message_key) }}</div>
  <p class="mt-3 text-xs text-slate-500">{{ t("plex_auth_error_no_changes") }}</p>
  <a href="{{ return_url }}" class="mt-5 inline-flex w-full sm:w-auto justify-center rounded bg-indigo-700 hover:bg-indigo-600 px-4 py-2 text-sm text-white">
    {{ t("plex_auth_error_return") }}
  </a>
</div>
{% endblock %}
