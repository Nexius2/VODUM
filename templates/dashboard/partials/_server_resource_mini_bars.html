<div class="flex shrink-0 items-start" style="width: 44px; gap: 4px;">
  {% for label, key, color in [('CPU', 'server_cpu_pct', '#818cf8'), ('RAM', 'server_ram_pct', '#34d399')] %}
    <div class="flex flex-col items-center" style="width: 20px; gap: 3px;">
    {% if s.status == 'up' and s[key] is defined and s[key] is not none %}
        <div role="meter" aria-label="{{ label }}" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ s[key] }}" class="overflow-hidden" style="position: relative; width: 11px; height: 26px; border-radius: 3px; background-color: #1e293b;">
          <span class="block rounded-full" style="position: absolute; bottom: 0; width: 100%; height: {{ s[key] }}%; background-color: {{ color }};"></span>
        </div>
        <span aria-hidden="true" style="font-size: 8px; line-height: 10px; font-weight: 600; color: #94a3b8;">{{ label }}</span>
    {% endif %}
    </div>
  {% endfor %}
</div>
