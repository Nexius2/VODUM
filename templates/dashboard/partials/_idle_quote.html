<div class="rounded-xl border border-slate-800 bg-slate-950/40 px-3 py-2">
    <div class="flex items-center gap-3">

        {% if idle_card.poster_url %}
          <div data-quote-artwork-slot class="w-20 h-28 shrink-0 rounded-lg bg-slate-900/80">
            <img
                src="{{ idle_card.poster_url }}"
                alt="{{ idle_card.title or '' }}"
                class="js-artwork-image js-quote-artwork opacity-0 w-20 h-28 rounded-lg object-cover border border-slate-700/70 shrink-0"
                loading="lazy"
                decoding="async"
            />
          </div>
        {% else %}
            <div class="w-20 h-28 rounded-lg border border-slate-700/70 bg-slate-900/80 shrink-0 flex items-center justify-center text-3xl text-slate-500">
                &ldquo;
            </div>
        {% endif %}

        <div class="min-w-0 flex-1">
            <div class="text-sm italic leading-5 text-slate-100">
                "{{ idle_card.phrase }}"
            </div>

            {% if idle_card.title %}
                <div class="text-xs text-slate-500 mt-1">
                    {{ idle_card.title }}{% if idle_card.year %} ({{ idle_card.year }}){% endif %}
                </div>
            {% endif %}
        </div>

    </div>
</div>
