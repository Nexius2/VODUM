{% extends "portal/base.html" %}
{% block content %}<section class="mx-auto max-w-lg rounded-xl border border-slate-800 bg-slate-900 p-6"><h1 class="text-xl font-semibold">{{ t('portal_plex_confirm_title') }}</h1><p class="mt-2 text-sm text-slate-400">{{ t('portal_plex_confirm_help') }}</p><form class="mt-5 space-y-4" method="post" action="{{ url_for('portal_plex_confirm') }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><input type="hidden" name="nonce" value="{{ nonce }}"><select required name="candidate" class="w-full rounded border border-slate-700 bg-slate-800 px-3 py-2">{% for candidate in candidates %}<option value="{{ loop.index0 }}">{{ t('portal_account_choice') }} {{ loop.index }}</option>{% endfor %}</select><button class="rounded bg-cyan-700 px-4 py-2 text-white">{{ t('confirm') }}</button></form></section>{% endblock %}
