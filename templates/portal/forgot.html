<!doctype html><html lang="{{ active_lang or 'en' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t("portal_forgot_password") }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4"><main class="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900 p-6"><h1 class="text-xl font-semibold">{{ t("portal_forgot_password") }}</h1><p class="my-4 text-sm text-slate-400">{{ t("portal_forgot_help") }}</p><form method="post" action="{{ url_for('portal_forgot_submit') }}" class="space-y-4"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><input type="email" name="email" required autocomplete="email" class="w-full rounded border border-slate-700 bg-slate-800 px-3 py-2">{% if turnstile and turnstile.enabled and turnstile.protect_portal %}<div class="cf-turnstile" data-sitekey="{{ turnstile.site_key }}" data-size="{{ turnstile.mode }}"></div><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{% endif %}<button class="w-full rounded bg-primary px-4 py-2 text-white">{{ t("portal_send_reset") }}</button></form></main></body></html>
