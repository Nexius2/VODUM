<!doctype html><html lang="{{ active_lang or 'en' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t("portal_activate_title") }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4"><main class="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900 p-6"><h1 class="text-xl font-semibold">{{ t("portal_activate_title") }}</h1><p class="text-sm text-slate-400 mt-1 mb-5">{{ t("portal_activate_help") }}</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="mb-3 rounded bg-slate-800 p-3 text-sm">{{ t(msg) }}</div>{% endfor %}{% endwith %}
<form method="post" action="{{ url_for('portal_activate_submit') }}" class="space-y-4"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}"><label class="block text-sm">{{ t("new_password") }}<input type="password" name="password" minlength="8" required autocomplete="new-password" class="mt-1 w-full rounded border border-slate-700 bg-slate-800 px-3 py-2"></label><label class="block text-sm">{{ t("confirm_password") }}<input type="password" name="password_confirm" minlength="8" required autocomplete="new-password" class="mt-1 w-full rounded border border-slate-700 bg-slate-800 px-3 py-2"></label><button class="w-full rounded bg-primary px-4 py-2 text-white">{{ t("portal_activate_action") }}</button></form></main></body></html>
