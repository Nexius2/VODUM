{# Themed confirmation used instead of the browser's confirm(). See static/js/confirm-modal.js. #}
<div id="vodum-confirm-modal" data-vodum-confirm-modal role="dialog" aria-modal="true"
     aria-labelledby="vodum-confirm-title" aria-describedby="vodum-confirm-message"
     class="fixed inset-0 z-50 hidden bg-black/70 flex items-center justify-center p-4" aria-hidden="true">
  <div class="vodum-modal-viewport w-full max-w-md overflow-hidden rounded-xl border border-slate-700 bg-slate-900 shadow-2xl">
    <div class="border-b border-slate-800 px-6 py-5">
      <h3 id="vodum-confirm-title" class="text-lg font-semibold text-white"></h3>
    </div>
    <div class="px-6 py-5">
      <p id="vodum-confirm-message" class="text-sm text-slate-300"></p>
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-800 px-6 py-4">
      <button type="button" data-vodum-confirm-cancel data-vodum-modal-close
              class="px-4 py-2 rounded-lg border border-slate-700 bg-slate-900 text-sm text-slate-200 hover:bg-slate-800">{{ t("cancel") }}</button>
      <button type="button" data-vodum-confirm-ok
              class="px-4 py-2 rounded-lg bg-rose-700 hover:bg-rose-800 text-sm text-white">{{ t("confirm") }}</button>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/confirm-modal.js', v=g.app_version|default('dev')) }}"></script>
