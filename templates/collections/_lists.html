<section id="cl-panel-lists" role="tabpanel" aria-labelledby="cl-tab-lists" hidden>
  <div class="cl-section-heading"><div><h3>{{ t('collections.lists_title') }}</h3><p>{{ t('collections.lists_hint') }}</p></div></div>
  <p id="cl-lists-message" class="cl-notice" role="status" aria-live="polite" hidden></p>
  <div class="cl-lists-layout">
    <aside class="cl-lists-sidebar">
      <div class="cl-lists-sidebar-heading"><strong>{{ t('collections.lists_title') }}</strong><span id="cl-lists-total"></span></div>
      <label class="cl-field cl-lists-search"><span class="sr-only">{{ t('collections.lists_search') }}</span><input id="cl-lists-search" type="search" placeholder="{{ t('collections.lists_search') }}"></label>
      <nav id="cl-lists-nav" aria-label="{{ t('collections.lists_title') }}"></nav>
      <details class="cl-list-create-disclosure"><summary>{{ t('collections.lists_new') }}</summary><form id="cl-list-create" class="cl-list-create"><label class="cl-field">{{ t('collections.lists_name') }}<input name="name" required maxlength="120"></label><button class="cl-button" type="submit">{{ t('collections.lists_create') }}</button></form></details>
    </aside>
    <div id="cl-list-detail" class="cl-list-detail"><p class="cl-muted">{{ t('collections.lists_choose') }}</p></div>
  </div>
</section>
<dialog id="cl-list-delete-confirm" class="cl-dialog cl-delete-dialog" aria-labelledby="cl-list-delete-title" aria-describedby="cl-list-delete-description">
  <form method="dialog" data-no-navigation-loader hx-boost="false">
    <header class="cl-dialog-header"><h2 id="cl-list-delete-title">{{ t('collections.lists_delete') }}</h2><button type="submit" value="cancel" class="cl-icon-button" aria-label="{{ t('collections.close') }}">×</button></header>
    <div class="cl-dialog-body"><div class="cl-delete-target"><strong id="cl-list-delete-name"></strong></div><p id="cl-list-delete-description" class="cl-muted">{{ t('collections.lists_delete_confirm') }}</p></div>
    <footer class="cl-dialog-footer"><button type="submit" value="cancel" class="cl-button" autofocus>{{ t('collections.cancel') }}</button><button type="submit" value="delete" class="cl-button cl-button-danger">{{ t('collections.lists_delete') }}</button></footer>
  </form>
</dialog>
